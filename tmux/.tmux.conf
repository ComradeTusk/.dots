# ===========================
# TMUX Configuration
# ===========================

# ===========================
# General Settings
# ===========================

# Enable mouse support
set -g mouse on

# Set default terminal to support 256 colors
set -g default-terminal "tmux-256color"
set -g status-position top

# Enable RGB color support
set -ag terminal-overrides ",xterm-256color:RGB"

# Start window numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# # Set escape time to 0 for better vim experience
# set -sg escape-time 0
#
# # Enable focus events for better vim integration
# set -g focus-events on

# ===========================
# Key Bindings
# ===========================

# Change prefix from C-b to C-a
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim-style keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===========================
# TPM - Plugin Manager
# ===========================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# ===========================
# Catppuccin Theme Configuration
# ===========================

# Set flavor (latte, frappe, macchiato, mocha)
set -g @catppuccin_flavor 'mocha'

# Set window status style
set -g @catppuccin_window_status_style "slanted"

# Configure status line
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}#{E:@catppuccin_status_uptime}"

# ===========================
# Initialize TPM
# ===========================
# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
